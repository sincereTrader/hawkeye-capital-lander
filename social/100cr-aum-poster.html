<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hawkeye Capital | ₹100 Cr AUM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=DM+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        /* Hawkeye Paper tokens, mirrored from the production build */
        --cream: #f5edd8;
        --cream-dark: #e8dfc8;
        --forest: #1c3a2b;
        --brown: #3b2a1a;
        --gold: #b8963e;
        --ink: #1a1209;
        --muted: #7a6e60;
        --display: "Cormorant Garamond", Georgia, serif;
        --sans: "DM Sans", sans-serif;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #101e16;
      }

      /* Export this 1080 × 1920 artboard for Stories and Reels covers. */
      .poster {
        position: relative;
        isolation: isolate;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        padding: 88px 86px 76px;
        color: var(--cream);
        background:
          radial-gradient(circle at 85% 11%, rgba(184, 150, 62, .22), transparent 18%),
          radial-gradient(circle at 12% 83%, rgba(184, 150, 62, .12), transparent 20%),
          linear-gradient(148deg, #254837 0%, var(--forest) 56%, #152d21 100%);
      }

      .poster::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        opacity: .25;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.88' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.26'/%3E%3C/svg%3E");
        mix-blend-mode: soft-light;
        pointer-events: none;
      }

      .poster::after {
        content: "";
        position: absolute;
        width: 1160px;
        height: 1160px;
        top: 347px;
        left: -40px;
        z-index: -1;
        border: 1px solid rgba(245, 237, 216, .13);
        border-radius: 50%;
        box-shadow: 0 0 0 72px rgba(245, 237, 216, .035), 0 0 0 145px rgba(245, 237, 216, .025);
      }

      .masthead { display: flex; align-items: center; justify-content: space-between; }

      .brand { display: flex; gap: 20px; align-items: center; }

      .logo {
        width: 152px;
        height: 75px;
        object-fit: contain;
      }

      .brand-name { margin: 0; font: 500 33px/1 var(--display); letter-spacing: .035em; }
      .brand-type { margin: 7px 0 0; color: rgba(245, 237, 216, .62); font: 500 14px/1 var(--sans); letter-spacing: .16em; text-transform: uppercase; }
      .edition { color: var(--gold); font: 500 13px/1 var(--sans); letter-spacing: .16em; text-transform: uppercase; }

      .content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding-bottom: 56px; }
      .eyebrow { margin: 0 0 37px; color: var(--gold); font: 500 17px/1.2 var(--sans); letter-spacing: .22em; text-transform: uppercase; }
      .rule { width: 90px; height: 1px; margin-bottom: 36px; background: var(--gold); }

      .amount { margin: 0; color: var(--cream); font: 500 267px/.76 var(--display); letter-spacing: -.065em; white-space: nowrap; }
      .amount .rupee { position: relative; top: -23px; margin-right: 7px; color: var(--gold); font-size: .66em; letter-spacing: -.09em; }
      .unit { margin: 26px 0 0; color: var(--gold); font: 500 48px/1 var(--display); letter-spacing: .08em; }
      .unit span { font: 500 16px/1 var(--sans); letter-spacing: .20em; vertical-align: middle; text-transform: uppercase; }

      .statement { max-width: 690px; margin: 88px 0 0; color: rgba(245, 237, 216, .92); font: 400 34px/1.35 var(--display); }
      .statement strong { color: var(--cream); font-weight: 600; }
      .as-of { margin: 31px 0 0; color: rgba(245, 237, 216, .54); font: 500 14px/1.2 var(--sans); letter-spacing: .13em; text-transform: uppercase; }

      .footer { display: grid; grid-template-columns: 1fr auto; gap: 26px; align-items: end; padding-top: 35px; border-top: 1px solid rgba(184, 150, 62, .58); }
      .cta-label { margin: 0 0 10px; color: var(--gold); font: 500 13px/1.2 var(--sans); letter-spacing: .15em; text-transform: uppercase; }
      .cta { margin: 0; font: 500 27px/1.15 var(--display); }
      .contact { text-align: right; color: rgba(245, 237, 216, .83); font: 500 15px/1.75 var(--sans); letter-spacing: .035em; }
      .contact a { color: inherit; text-decoration: none; }

      @media (max-width: 1100px) {
        body { display: block; background: var(--forest); }
        .poster { transform-origin: top left; transform: scale(calc(100vw / 1080)); margin-bottom: calc(-1920px + (1920px * 100vw / 1080)); }
      }
      @media print { body { background: none; } .poster { transform: none; } }
    </style>
  </head>
  <body>
    <main class="poster" aria-label="Hawkeye Capital ₹100 Cr AUM celebration">
      <header class="masthead">
        <div class="brand">
          <img class="logo" src="../assets/hawkeye-capital-logo.svg" alt="Hawkeye Capital logo" />
          <div>
            <p class="brand-name">Hawkeye Capital</p>
            <p class="brand-type">Invest with clarity</p>
          </div>
        </div>
        <span class="edition">A shared milestone</span>
      </header>

      <section class="content">
        <p class="eyebrow">With gratitude</p>
        <div class="rule"></div>
        <!-- Keep this central figure as the primary visual. -->
        <h1 class="amount"><span class="rupee">₹</span>100</h1>
        <p class="unit">Cr <span>Assets Under Management</span></p>

        <!-- Replace this working copy with final approved wording. -->
        <p class="statement">A milestone built on <strong>trust</strong>.<br />Thank you for being part of our journey.</p>
        <p class="as-of">AUM as of August 2026</p>
      </section>

      <footer class="footer">
        <div>
          <p class="cta-label">Begin your investment journey</p>
          <p class="cta">Build your future with clarity.</p>
        </div>
        <div class="contact">
          <a href="https://hawkeyecapital.in">hawkeyecapital.in</a><br />
          <a href="tel:+919540134700">+91 95401 34700</a>
        </div>
      </footer>
    </main>
  </body>
</html>
